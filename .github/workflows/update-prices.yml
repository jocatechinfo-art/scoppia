name: Update Scoppia bulk prices
on:
  push:
    branches: [main]
    paths: [scoppia-prices.zip, .github/workflows/update-prices.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and import reviewed source
        env:
          EXPECTED_SHA256: 9b220096dfdc4244995e22550601c1a6c0a21d90d68b3ec046f6cd39f3bdc02d
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path('scoppia-prices.zip')
          if not archive.exists():
              raise SystemExit('No source archive to import')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA256'], 'Unexpected source archive'
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.git'
              z.extractall('.')
          archive.unlink()
          PY
      - name: Commit source files
        run: |
          git config user.name 'jocatechinfo-art'
          git config user.email '315828637+jocatechinfo-art@users.noreply.github.com'
          git add --all
          git commit -m 'Add bulk price editing and update meals to BRL 23.90'
          git push origin HEAD:main
