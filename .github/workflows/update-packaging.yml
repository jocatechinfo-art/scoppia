name: Add packaging costs inventory and consumption history
on:
  push:
    branches: [main]
    paths: [scoppia-packaging.zip, .github/workflows/update-packaging.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and import reviewed source
        env:
          EXPECTED_SHA256: 2be673012c2c4e33a011b9304875e70448a017b8f5488c4a9729b394f487dfb4
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path('scoppia-packaging.zip')
          if not archive.exists():
              raise SystemExit('No source archive to import')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA256'], 'Unexpected source archive'
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.git'
                  assert entry.filename.startswith(('app/', 'lib/', 'backend/app/', 'backend/lib/', 'backend/db/', 'backend/drizzle/'))
              z.extractall('.')
          archive.unlink()
          PY
      - name: Commit source files
        run: |
          git config user.name 'jocatechinfo-art'
          git config user.email '315828637+jocatechinfo-art@users.noreply.github.com'
          git add --all
          git commit -m 'Add packaging inventory movements and recipe cost links'
          git push origin HEAD:main
