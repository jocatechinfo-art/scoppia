name: Import reviewed Scoppia source
on:
  push:
    branches: [main]
    paths: [scoppia-source.zip, .github/workflows/publish-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and import reviewed source
        env:
          EXPECTED_SHA256: dd75b3c8e712d3f53f3204c44b12aca5f7444b0ec7d977268ba067b5830bae86
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path('scoppia-source.zip')
          if not archive.exists():
              raise SystemExit('No source archive to import')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA256'], 'Unexpected source archive'
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.git'
              z.extractall('.')
          archive.unlink()
          PY
      - name: Commit source files
        run: |
          git config user.name 'jocatechinfo-art'
          git config user.email '315828637+jocatechinfo-art@users.noreply.github.com'
          git add --all
          git commit -m 'Publish Scoppia Gourmet app and persistent backend source'
          git push origin HEAD:main
